[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "augagent"
version = "1.2.0"
description = "An enterprise-grade autonomous ReAct agent framework"
readme = "README.md"
requires-python = ">=3.10"
authors = [
  {name = "Augmencord", email = "augmencord@gmail.com"}
]
license = {text = "MIT"}
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "pydantic>=2.0.0",
    "httpx>=0.24.0",
]

[project.urls]
Homepage = "https://github.com/Augmencord/augagent"
Repository = "https://github.com/Augmencord/augagent.git"
Changelog = "https://github.com/Augmencord/augagent/blob/main/CHANGELOG.md"

[project.optional-dependencies]
memory = ["chromadb>=0.4.0"]
web = ["markdownify>=0.11.0", "beautifulsoup4>=4.12.0", "requests>=2.31.0"]
telemetry = ["opentelemetry-api>=1.20.0", "opentelemetry-sdk>=1.20.0"]
api = ["fastapi>=0.100.0", "uvicorn[standard]>=0.23.0", "typer>=0.9.0", "websockets>=11.0.3", "PyJWT>=2.8.0"]
mcp = ["mcp>=0.1.0"]
dev = ["pytest>=7.0", "pytest-asyncio>=0.21.0"]

[project.scripts]
augagent = "augagent.cli:app"

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"
asyncio_default_test_loop_scope = "function"
