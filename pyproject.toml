[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "augagent"
version = "1.0.0"
description = "An enterprise-grade autonomous ReAct agent framework"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0.0",
    "httpx>=0.24.0",
]

[project.optional-dependencies]
memory = ["chromadb>=0.4.0"]
web = ["markdownify>=0.11.0", "beautifulsoup4>=4.12.0", "requests>=2.31.0"]
telemetry = ["opentelemetry-api>=1.20.0", "opentelemetry-sdk>=1.20.0"]
dev = ["pytest>=7.0", "pytest-asyncio>=0.21.0"]

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"
