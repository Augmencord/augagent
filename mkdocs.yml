site_name: AugAgent
site_description: A multi-agent framework with intuitive DX and Pydantic validation.
site_url: https://augmencord.github.io/augagent/

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - toc.integrate
  palette:
    scheme: slate
    primary: deep purple

nav:
  - Home: index.md
  - Tutorials:
    - Getting Started: tutorials/getting_started.md
    - Building Your First Team: tutorials/first_team.md
  - How-To Guides:
    - Writing Custom Tools: how-to/custom_tools.md
    - Context Chaining: how-to/context_chaining.md
    - Swapping LLMs: how-to/swapping_llms.md
  - Reference:
    - AugAgent: reference/agent.md
    - AugTask: reference/task.md
    - AugTeam: reference/team.md
    - Tools & Decorators: reference/tools.md
    - LLMConfig: reference/config.md
  - Explanations:
    - Architecture & Philosophy: ARCHITECTURE_WHY.md
    - The ReAct Loop: explanations/react_loop.md
    - Antigravity Ledger: ANTIGRAVITY_LEDGER.md
